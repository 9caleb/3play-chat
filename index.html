<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3PLAY Live Chat</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="layout">

  <!-- LEFT -->
  <div class="left">

    <div class="logo-wrap">
      <img src="3PLAY logo design.png">
    </div>

    <div class="center-group">
      <h1 class="hero-text"><span>START CHATTING NOW</span></h1>

      <div class="qr-wrap">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div class="rules">
      <p>🪪 Your name can be entered once only and cannot be changed</p>
      <p>🤝 Be respectful. No rude or offensive words</p>
      <p>🚫 No spamming</p>
      <p>📺 Messages appear live on screen</p>
      <p class="enjoy">🎉 Enjoy the party! <span>#PLAYwithme</span></p>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div id="chat"></div>

    <div class="input-area">
      <div class="name-wrap">
        <input id="name" placeholder="Enter your name">
        <div class="name-hint">Name can only be set once</div>
        <div class="name-hint">You can only send a message every 15 seconds</div>
      </div>

      <textarea id="message" placeholder="Type your message"></textarea>
      <button onclick="sendMessage()">SEND</button>
    </div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<script defer src="app.js"></script>
</body>
</html>
